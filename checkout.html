<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Amazon Essence</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://www.paypal.com/sdk/js?client-id=YOUR_CLIENT_ID&currency=BRL"></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="checkout.html">Checkout</a>
        </nav>
    </header>

    <div class="container">
        <h2>Checkout</h2>
        <form id="checkout-form">
            <label for="name">Name</label><br>
            <input type="text" id="name" name="name" required><br><br>
            <label for="address">Address</label><br>
            <input type="text" id="address" name="address" required><br><br>
            <label for="email">Email</label><br>
            <input type="email" id="email" name="email" required><br><br>
        </form>
        <div id="paypal-button-container"></div>
        <p>Or pay with your international credit card during PayPal checkout.</p>
    </div>

    <script>
        paypal.Buttons({
            createOrder: function(data, actions) {
                return actions.order.create({
                    purchase_units: [{ amount: { value: '49.99', currency_code: 'BRL' } }]
                });
            },
            onApprove: function(data, actions) {
                return actions.order.capture().then(function(details) {
                    alert('Transaction completed by ' + details.payer.name.given_name + '!');
                });
            }
        }).render('#paypal-button-container');
    </script>

    <footer>
        &copy; 2024 Amazon Essence
    </footer>
</body>
</html>
